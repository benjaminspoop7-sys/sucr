<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t5 d5">
  <title id="t5">No streams found here</title>
  <desc id="desc5">A media panel outline holding two track rows and one dashed row, with a crossed circle marking that no manifest answered.</desc>
  <style>
    .ln{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .dim{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;opacity:.45}
    .dash{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-dasharray:5 5;opacity:.55}
    .ac{fill:none;stroke:var(--accent-ink,#1765CC);stroke-width:2;stroke-linecap:round}
  </style>
  <rect class="ln" x="24" y="22" width="112" height="62" rx="8"/>
  <circle class="dim" cx="42" cy="40" r="5"/>
  <path class="dim" d="M56 40h54"/>
  <circle class="dim" cx="42" cy="58" r="5"/>
  <path class="dim" d="M56 58h38"/>
  <circle class="dash" cx="42" cy="76" r="5"/>
  <path class="dash" d="M56 76h46"/>
  <!-- one accented mark, and it carries the meaning: nothing answered -->
  <circle class="ac" cx="118" cy="96" r="11"/>
  <path class="ac" d="M110 104 126 88"/>
</svg>
